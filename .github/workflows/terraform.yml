name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "scripts/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - "scripts/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-plan:
    name: Validate and Plan
    runs-on: ubuntu-latest
    environment: ${{ vars.TERRAFORM_ENVIRONMENT || 'development' }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_CLI_ARGS_init: "-backend-config=backend.hcl"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Configure remote state
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          printf 'bucket = "%s"\nprefix = "terraform/gcp-ha-web-tier"\n' "$TF_STATE_BUCKET" > backend.hcl

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: tfplan
          retention-days: 7


  terraform-apply:
    name: Terraform Apply

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - validate-and-plan

    runs-on: ubuntu-latest
    environment: ${{ vars.TERRAFORM_ENVIRONMENT || 'development' }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_CLI_ARGS_init: "-backend-config=backend.hcl"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Configure remote state
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          printf 'bucket = "%s"\nprefix = "terraform/gcp-ha-web-tier"\n' "$TF_STATE_BUCKET" > backend.hcl

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
